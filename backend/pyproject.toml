[project]
name = "agnobuilder-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.8.7",
    "alembic>=1.19.1",
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    # `psycopg[binary]` ships pre-built wheels for the Postgres
    # driver (psycopg3) so we don't need a libpq-dev system dep in
    # the docker image. The `[binary]` extra pulls in the wheel.
    # Used only when `AGNOBUILDER_DATABASE_URL` is `postgresql+psycopg://...`
    # (the docker-compose path). Local dev still uses SQLite.
    "psycopg[binary]>=3.1",
    # `pgvector` is the Python binding for Postgres' vector type.
    # Required by `agno.vectordb.pgvector.PgVector` when a knowledge
    # node selects `vectorDb='pgvector'`. The extension itself runs
    # inside the Postgres container (`pgvector/pgvector:pg16` image,
    # see `docker-compose.yml`); this package is the SQLAlchemy
    # type adapter that lets Python emit / read `vector(...)`
    # columns. Optional — only loaded when a user picks pgvector in
    # the knowledge form (others fall back to lancedb / chroma
    # which have their own Python deps).
    "pgvector>=0.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
